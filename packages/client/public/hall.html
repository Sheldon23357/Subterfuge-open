<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07171f"><title>深潜 · 作战大厅</title><style id="hall-loading-style">html,body{margin:0;background:#07171f;color-scheme:dark}
.hall-loading-shell{box-sizing:border-box;position:relative;isolation:isolate;display:grid;place-items:center;min-height:100svh;margin:0;padding:28px;background:radial-gradient(ellipse at 65% 20%,#164754 0,transparent 62%),#07171f;color:#d6e5df;font-family:Arial,"Microsoft YaHei",sans-serif;overflow:hidden}
.hall-loading-shell .hall-art{position:absolute;inset:0;z-index:-2;height:100%;pointer-events:none;opacity:.52}
.hall-loading-shell .hall-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 38%}
.hall-loading-shell::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#07171f33,#07171fbb),radial-gradient(ellipse at center,transparent,#07171f99);pointer-events:none}
.hall-loading-card{box-sizing:border-box;width:min(100%,400px);padding:46px 32px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid #93b1a52e;border-top-color:#c8b47b77;border-radius:4px;background:linear-gradient(150deg,#16343bd9,#091d27e8);box-shadow:0 24px 90px #0005,inset 0 1px #e7eedb06;backdrop-filter:blur(16px)}
.hall-loading-emblem{position:relative;display:grid;place-items:center;width:88px;height:88px;margin-bottom:26px;border:1px solid #aabfba20;border-radius:50%;color:#cdbb86;background:radial-gradient(circle,#cbb77910,transparent 68%);box-shadow:0 0 40px #78c7bd09}
.hall-loading-emblem::before{content:"";position:absolute;inset:-7px;border:1px solid transparent;border-top-color:#d6c590aa;border-right-color:#9ac6bb44;border-radius:50%;animation:hall-orbit 2.8s linear infinite}
.hall-loading-emblem svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.hall-loading-card h1{margin:0 0 18px;padding-left:.4em;font-size:30px;font-weight:400;letter-spacing:.4em;line-height:1.3;color:#ded0aa}
.hall-loading-card p{margin:0;font-size:13px;letter-spacing:.12em;line-height:1.8;color:#a7c2c1}
.hall-loading-track{position:relative;width:116px;height:2px;margin:28px 0 0;background:#91bcb21a;overflow:hidden;border-radius:2px}
.hall-loading-track::after{content:"";position:absolute;inset:0;width:48px;background:linear-gradient(90deg,transparent,#c8bb88,#8bc4b8,transparent);animation:hall-scan 2.1s ease-in-out infinite}
.hall-loading-retry{margin-top:24px;padding:10px 24px;border:1px solid #839d8a88;border-radius:3px;background:#254047;color:#e1e5cf;font:inherit;cursor:pointer}
.hall-loading-retry[hidden]{display:none}.hall-loading-retry:focus-visible{outline:2px solid #d4bd7d;outline-offset:4px}
.hall-loading-shell[data-state=error] .hall-loading-emblem::before,.hall-loading-shell[data-state=error] .hall-loading-track::after{animation:none;opacity:.3}
@keyframes hall-orbit{to{transform:rotate(360deg)}}@keyframes hall-scan{0%{transform:translateX(-48px)}100%{transform:translateX(164px)}}
@media(max-width:520px){.hall-loading-shell{padding:24px}.hall-loading-card{padding:38px 24px 34px}.hall-loading-emblem{width:76px;height:76px}.hall-loading-card h1{font-size:27px}}
@media(prefers-reduced-motion:reduce){.hall-loading-emblem::before,.hall-loading-track::after{animation:none}.hall-loading-track::after{transform:translateX(34px)}}
</style><link rel="preload" as="image" href="/assets/lobby/deep-harbor.jpg" fetchpriority="high"><link id="hall-stylesheet" rel="stylesheet" href="/hall.css" media="print"></head><body><div id="root"><main class="hall-loading-shell" aria-busy="true"><div class="hall-art" aria-hidden="true"><img src="/assets/lobby/deep-harbor.jpg" alt="" fetchpriority="high"></div><section class="hall-loading-card" role="status" aria-live="polite"><span class="hall-loading-emblem" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"/><path d="M12 8v13M5 12H2a10 10 0 0 0 20 0h-3M8 12h8"/></svg></span><h1>深 潜</h1><p class="hall-loading-message">正在连接大厅…</p><span class="hall-loading-track" aria-hidden="true"></span><button class="hall-loading-retry" hidden>重新加载</button><noscript>请启用 JavaScript 后重新加载。</noscript></section></main></div><script type="module" src="/assets/lobby/hall-bootstrap.js"></script></body></html>
